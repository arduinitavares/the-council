            --node "$(command -v node)"

  defaults:
    name: Bootstrap qualification (defaults)
    needs: diagnostics
    if: >-
      ${{ needs.diagnostics.result == 'success' &&
          github.event_name == 'push' &&
          github.repository == 'arduinitavares/the-council' &&
          github.ref == 'refs/heads/dev/issue-1-first-use-reviewed' &&
          github.event.repository.visibility == 'public' &&
          github.event.repository.private == false }}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - name: Check out the event commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
