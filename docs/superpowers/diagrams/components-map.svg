<rect x="430.4" y="506" width="839.2" height="28" rx="4" fill="white"/>
<text x="850" y="525" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#233d55" text-anchor="middle" font-weight="400">Clarification: reviewers only. Deliberation: review → fresh judge → final responses.</text>
<text x="850" y="840" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#233d55" text-anchor="middle" font-weight="600">Three equal reviewer seats. Only their matching explicit acceptances can produce consensus.</text>
<text x="850" y="895" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#233d55" text-anchor="middle" font-weight="400">The judge validates evidence and challenges arguments. It cannot vote or overrule a reviewer.</text>
