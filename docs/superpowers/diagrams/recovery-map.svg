<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1070" viewBox="0 0 1660 1070">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#476783"/></marker></defs>
<rect width="1660" height="1070" fill="#ffffff"/>
<text x="60" y="52" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#142b44" text-anchor="start" font-weight="700">The Council: pause, resume, and recovery</text>
<text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#51667b" text-anchor="start" font-weight="400">Three-hour active-work budget. Human wait pauses it only after every owned worker and resource has settled.</text>
<rect x="70" y="150" width="400" height="110" rx="14" fill="#eaf2ff" stroke="#3972b7" stroke-width="2"/>
<text x="270.0" y="197.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#17364e" text-anchor="middle" font-weight="600">Any active phase</text>
<text x="270.0" y="227.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#17364e" text-anchor="middle" font-weight="400">work / crash downtime charged</text>
<rect x="620" y="150" width="400" height="110" rx="14" fill="#eaf2ff" stroke="#3972b7" stroke-width="2"/>
<text x="820.0" y="197.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#17364e" text-anchor="middle" font-weight="600">settling</text>
<text x="820.0" y="227.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#17364e" text-anchor="middle" font-weight="400">stop and inspect owned resources</text>
<rect x="1170" y="150" width="400" height="110" rx="14" fill="#fff3d9" stroke="#b77b1c" stroke-width="2"/>
<text x="1370.0" y="197.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#17364e" text-anchor="middle" font-weight="600">Settled human wait</text>
<text x="1370.0" y="227.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#17364e" text-anchor="middle" font-weight="400">save remaining time / exit</text>
<rect x="70" y="440" width="400" height="110" rx="14" fill="#f0f3f7" stroke="#758395" stroke-width="2"/>
<text x="270.0" y="487.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#17364e" text-anchor="middle" font-weight="600">reconciling</text>
<text x="270.0" y="517.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#17364e" text-anchor="middle" font-weight="400">restore always enters here</text>
<rect x="620" y="440" width="400" height="110" rx="14" fill="#fff0ee" stroke="#b95c51" stroke-width="2"/>
<text x="820.0" y="487.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#17364e" text-anchor="middle" font-weight="600">Unknown lifecycle</text>
<text x="820.0" y="517.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#17364e" text-anchor="middle" font-weight="400">keep observing / clock active</text>
<rect x="1170" y="440" width="400" height="110" rx="14" fill="#fff3d9" stroke="#b77b1c" stroke-width="2"/>
<text x="1370.0" y="487.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#17364e" text-anchor="middle" font-weight="600">Durable answer inbox</text>
<text x="1370.0" y="517.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#17364e" text-anchor="middle" font-weight="400">partial replies stay paused</text>
<rect x="70" y="740" width="400" height="110" rx="14" fill="#e9f6ee" stroke="#39805a" stroke-width="2"/>
<text x="270.0" y="787.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#17364e" text-anchor="middle" font-weight="600">Same attempt live</text>
<text x="270.0" y="817.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#17364e" text-anchor="middle" font-weight="400">resume saved phase / no duplicate</text>
<rect x="620" y="740" width="400" height="110" rx="14" fill="#e9f6ee" stroke="#39805a" stroke-width="2"/>
<text x="820.0" y="787.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#17364e" text-anchor="middle" font-weight="600">Exit positively established</text>
<text x="820.0" y="817.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#17364e" text-anchor="middle" font-weight="400">process result / settle safely</text>
<rect x="1170" y="740" width="400" height="110" rx="14" fill="#eaf2ff" stroke="#3972b7" stroke-width="2"/>
<text x="1370.0" y="787.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#17364e" text-anchor="middle" font-weight="600">Finalized answers / resume</text>
<text x="1370.0" y="817.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#17364e" text-anchor="middle" font-weight="400">reconcile → preflight → consume</text>
<polyline points="470,205 620,205" fill="none" stroke="#476783" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="492.9" y="118" width="104.2" height="26" rx="4" fill="white"/>
<text x="545" y="135" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#233d55" text-anchor="middle" font-weight="400">stop event</text>
<polyline points="1020,205 1170,205" fill="none" stroke="#476783" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1038.5" y="118" width="113.0" height="26" rx="4" fill="white"/>
<text x="1095" y="135" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#233d55" text-anchor="middle" font-weight="400">all settled</text>
<polyline points="820,260 820,440" fill="none" stroke="#476783" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="841.1" y="333" width="77.7" height="26" rx="4" fill="white"/>
<text x="880" y="350" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#233d55" text-anchor="middle" font-weight="400">unknown</text>
<polyline points="620,495 470,495" fill="none" stroke="#476783" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="479.7" y="401" width="130.7" height="26" rx="4" fill="white"/>
<text x="545" y="418" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#233d55" text-anchor="middle" font-weight="400">observe again</text>
<polyline points="270,260 270,440" fill="none" stroke="#476783" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<rect x="181.8" y="333" width="236.5" height="26" rx="4" fill="white"/>
<text x="300" y="350" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#233d55" text-anchor="middle" font-weight="400">restore / lost connection</text>
<polyline points="270,550 270,740" fill="none" stroke="#476783" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="293.5" y="633" width="113.0" height="26" rx="4" fill="white"/>
<text x="350" y="650" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#233d55" text-anchor="middle" font-weight="400">live proved</text>
<polyline points="470,525 540,525 540,795 620,795" fill="none" stroke="#476783" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="503.5" y="673" width="113.0" height="26" rx="4" fill="white"/>
<text x="560" y="690" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#233d55" text-anchor="middle" font-weight="400">exit proved</text>
<polyline points="1370,260 1370,440" fill="none" stroke="#476783" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1225.3" y="333" width="289.4" height="26" rx="4" fill="white"/>
<text x="1370" y="350" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#233d55" text-anchor="middle" font-weight="400">wait hours or days: zero charge</text>
<polyline points="1370,550 1370,740" fill="none" stroke="#476783" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1238.5" y="633" width="263.0" height="26" rx="4" fill="white"/>
<text x="1370" y="650" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#233d55" text-anchor="middle" font-weight="400">no worker for partial drafts</text>
<polyline points="1170,825 1120,825 1120,945 40,945 40,495 70,495" fill="none" stroke="#476783" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="830" y="1015" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#233d55" text-anchor="middle" font-weight="600">Unknown exit never becomes settlement. Resume opens a new active interval using only saved remaining time.</text>
</svg>
