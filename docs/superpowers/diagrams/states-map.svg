<text x="60" y="790" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#17364e" text-anchor="start" font-weight="600">Default limit: 3 admitted rounds. The first initial-review inference consumes the round.</text>
<text x="60" y="840" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#51667b" text-anchor="start" font-weight="400">An early missing-input pause still consumes that round. A fourth round needs user authorization.</text>
<text x="60" y="890" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#51667b" text-anchor="start" font-weight="400">Consensus requires the same candidate, evidence bundle, and judge report in all three final replies.</text>
<text x="60" y="940" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#51667b" text-anchor="start" font-weight="400">New input or an authorized remedy returns to preflight. Restarts enter reconciling before new effects.</text>
<text x="60" y="990" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#51667b" text-anchor="start" font-weight="400">Selected return paths are summarized here. The editable Mermaid source contains the full transition map.</text>
