<text x="60" y="975" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#233d55" text-anchor="start" font-weight="600">2 clarification batches → up to 3 deliberation rounds. Default maximum: 6 + 21 = 27 worker calls.</text>
<text x="60" y="1025" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#233d55" text-anchor="start" font-weight="400">All-ready waves may skip clarification. New answers reach every seat through one shared context revision.</text>
<text x="60" y="1075" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#233d55" text-anchor="start" font-weight="400">Evidence collection finishes before candidate synthesis. A late blocking question consumes its deliberation round.</text>
<text x="60" y="1125" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#233d55" text-anchor="start" font-weight="400">Every active phase can settle or reconcile. Positive live recovery observes the same attempt; it does not relaunch.</text>
